<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8">
		<title>Ejercicios - Velnora</title>
	</head>
	<body>
		<!-- La lista de sugerencias está escrita a mano dentro del HTML -->
		<label>Ejercicio <input type="text" name="ejercicio" list="ejercicios"></label>

		<datalist id="ejercicios">
			<!-- PECHO -->
			<option value="Press de banca">
			<option value="Press inclinado con mancuernas">
			<option value="Aperturas con mancuernas">
			<option value="Flexiones">
			<!-- ESPALDA -->
			<option value="Dominadas">
			<option value="Remo con barra">
			<option value="Jalón al pecho">
			<option value="Peso muerto">
			<!-- PIERNAS -->
			<option value="Sentadilla">
			<option value="Prensa de piernas">
			<option value="Zancadas">
			<option value="Hip thrust">
			<!-- HOMBROS Y BRAZOS -->
			<option value="Press militar">
			<option value="Elevaciones laterales">
			<option value="Curl de bíceps con barra">
			<option value="Press francés">
			<!-- CORE Y CARDIO -->
			<option value="Plancha">
			<option value="Burpees">
			<option value="Kettlebell swing">
		</datalist>

		<p>Problema: si el gimnasio añade un ejercicio, hay que tocar el HTML. En el 005 la lista sale de la base de datos.</p>
	</body>
</html>
