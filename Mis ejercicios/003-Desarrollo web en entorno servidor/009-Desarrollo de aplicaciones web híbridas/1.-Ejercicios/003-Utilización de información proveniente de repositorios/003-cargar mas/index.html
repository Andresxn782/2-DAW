<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Velnora TV</title>
		<link rel="stylesheet" href="../estilos.css">
	</head>
	<body>
		<header><h1>Velnora <span>TV</span></h1></header>
		<main></main>
		<template id="video">
			<article>
				<img src="" alt="">
				<h3></h3>
				<p></p>
			</article>
		</template>
		<script>
			let pagina = 0
			let contenedor = document.querySelector("main")
			let plantilla = document.querySelector("#video")

			// El botón lo creo una vez y lo voy moviendo al final
			let boton = document.createElement("button")
			boton.className = "mas"
			boton.textContent = "Cargar más"
			boton.onclick = function(){
				pagina++
				cargar()
			}

			function cargar(){
				boton.disabled = true
				fetch("servidor.php?pagina=" + pagina)
				.then(function(resultado){ return resultado.json() })
				.then(function(datos){
					datos.entrenos.forEach(function(dato){
						let instancia = plantilla.content.cloneNode(true)
						instancia.querySelector("h3").textContent = dato.titulo
						instancia.querySelector("p").textContent = dato.categoria + " · " + dato.minutos + " min"
						instancia.querySelector("img").src = "../repositorio/miniatura.php?id=" + dato.id
						instancia.querySelector("img").alt = dato.titulo
						contenedor.appendChild(instancia)
					})
					boton.disabled = false
					if(datos.hayMas){
						contenedor.appendChild(boton)
					} else {
						boton.remove()
					}
				})
			}

			cargar()
		</script>
	</body>
</html>
