<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8">
		<title>jQuery - Velnora</title>
		<!-- Librería de terceros: la cargo desde mi carpeta libs -->
		<script src="../libs/jquery-3.7.1.min.js"></script>
	</head>
	<body>
		<div id="contenedor"></div>
		<div id="contenedor2"></div>
		<script>
			// Con jQuery
			$("#contenedor").text("Bienvenido a Velnora (escrito con jQuery)")
			// Lo mismo con JavaScript normal
			document.querySelector("#contenedor2").textContent = "Bienvenido a Velnora (escrito con JavaScript)"
		</script>
	</body>
</html>
