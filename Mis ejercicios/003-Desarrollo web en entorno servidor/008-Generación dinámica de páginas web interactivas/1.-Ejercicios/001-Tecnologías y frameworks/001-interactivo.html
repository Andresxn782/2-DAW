<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8">
		<title>Calculadora de IMC - Velnora</title>
	</head>
	<body>
		<!-- Todo pasa en el navegador: no hay ninguna petición al servidor -->
		<h1>Calculadora de IMC</h1>
		<input type="number" id="peso" placeholder="Peso en kg">
		<input type="number" id="altura" placeholder="Altura en cm">
		<button>Calcula</button>
		<output></output>
		<script>
			let boton = document.querySelector("button")
			boton.onclick = function(){
				let peso = document.querySelector("#peso").value * 1
				let altura = document.querySelector("#altura").value / 100
				let salida = document.querySelector("output")
				if(peso <= 0 || altura <= 0){
					salida.textContent = "Escribe el peso y la altura"
					return
				}
				let imc = peso / (altura * altura)
				let texto = "normal"
				if(imc < 18.5){ texto = "bajo" }
				else if(imc >= 30){ texto = "obesidad" }
				else if(imc >= 25){ texto = "sobrepeso" }
				salida.textContent = "IMC " + imc.toFixed(1) + " (" + texto + ")"
			}
		</script>
	</body>
</html>
