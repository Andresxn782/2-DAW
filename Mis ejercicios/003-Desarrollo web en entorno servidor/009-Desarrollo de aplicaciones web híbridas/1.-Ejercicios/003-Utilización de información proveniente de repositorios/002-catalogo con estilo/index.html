<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8">
		<title>Velnora TV</title>
		<link rel="stylesheet" href="../estilos.css">
	</head>
	<body>
		<header><h1>Velnora <span>TV</span></h1></header>
		<main></main>
		<!-- Molde de cada vídeo -->
		<template id="video">
			<article>
				<img src="" alt="">
				<h3>[titulo]</h3>
				<p>[categoria]</p>
			</article>
		</template>
		<script>
			let contenedor = document.querySelector("main")
			let plantilla = document.querySelector("#video")
			fetch("servidor.php")
			.then(function(resultado){ return resultado.json() })
			.then(function(datos){
				console.log(datos)
				datos.forEach(function(dato){
					let instancia = plantilla.content.cloneNode(true)
					instancia.querySelector("h3").textContent = dato.titulo
					instancia.querySelector("p").textContent = dato.categoria + " · " + dato.minutos + " min"
					instancia.querySelector("img").src = "../repositorio/miniatura.php?id=" + dato.id
					instancia.querySelector("img").alt = dato.titulo
					contenedor.appendChild(instancia)
				})
			})
		</script>
	</body>
</html>
