<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8">
		<title>Velnora Sala</title>
		<style>
			html,body{width:100%;height:100%;padding:0px;margin:0px;}
			p{padding:0px;margin:0px;}
			body{display:flex;background:#1f2937;justify-content:center;align-items:center;font-family:Arial, sans-serif;}
			#entrada{
				width:220px;padding:20px;background:white;border-radius:10px;
				display:flex;flex-direction:column;gap:10px;
			}
			#chat{display:none;width:400px;height:600px;padding:20px;background:white;
				flex-direction:column;gap:10px;}
		</style>
	</head>
	<body>
		<div id="entrada">
			<h3>Velnora Sala</h3>
			<p>¿Cómo te llamas?</p>
			<input type="text" id="usuario">
			<button id="entrar">Entrar</button>
		</div>
		<div id="chat">
			<main>
				<article>mensaje</article>
			</main>
			<nav>
				<input type="text" id="mensaje">
			</nav>
		</div>
		<script>
			let boton = document.querySelector("#entrar")
			boton.onclick = function(){
				let entrada = document.querySelector("#usuario")
				if(entrada.value.trim() === ""){
					return
				}
				localStorage.setItem("usuario", entrada.value.trim())
				// Cambio una pantalla por otra
				document.querySelector("#entrada").style.display = "none"
				document.querySelector("#chat").style.display = "flex"
			}
		</script>
	</body>
</html>
